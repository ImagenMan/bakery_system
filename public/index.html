<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <header class="app-header">
        <h1>🍩 Bakery System</h1>
        <div id="connection-status">Connecting...</div>
    </header>

    <main>

    <section id="orders-view" class="view">

        <div class="section-header">
            <h2>Orders</h2>
            <button id="refresh-orders">Refresh</button>
        </div>

        <div id="orders-list">
            <p class="loading">Loading orders...</p>
        </div>

    </section>


    <section id="order-detail-view" class="view hidden">

        <div class="section-header">
            <button id="back-to-orders">← Orders</button>
            <h2>Order Details</h2>
        </div>

        <div id="order-detail">
            <p class="loading">Loading order...</p>
        </div>

    </section>

</main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>

</body>

</html>
